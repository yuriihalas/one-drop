<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Земля: прототип</title><link rel="stylesheet" href="kit.css"></head><body>
<script src="kit.js"></script>
<script>
// LAW: a plate hums where it is touched, and sand runs away from every place that shakes.
// It comes to rest on the still lines of the standing wave. Where the plate is touched decides
// which of its standing waves answer, and so which figure the sand draws.
const G = 96, A0 = 8, A1 = 87, SIDE = A1 - A0 + 1, C2 = 0.25, KEEP = 0.9994, DRIVE = 0.1, TOTAL = 2600, GRAINS = 5200;
let P0 = new Float32Array(G * G), P1 = new Float32Array(G * G), P2 = new Float32Array(G * G), env = new Float32Array(G * G);
const sx = new Float32Array(GRAINS), sy = new Float32Array(GRAINS);
let src = -1, tick = 0, omega = 0, LVE = null, seed = 1;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
function modeOmega(m, n) { const a = Math.sin(m * Math.PI / SIDE / 2), b = Math.sin(n * Math.PI / SIDE / 2); return 2 * Math.asin(Math.sqrt(C2 * (a * a + b * b))); }
function earthBuild(L) { LVE = L; P0.fill(0); P1.fill(0); P2.fill(0); env.fill(0); src = -1; tick = 0; omega = modeOmega(L.mode[0], L.mode[1]); seed = 12345;
  for (let k = 0; k < GRAINS; k++) { sx[k] = A0 + rnd() * SIDE; sy[k] = A0 + rnd() * SIDE; } }
function earthTap(x, y) { src = y * G + x; tick = 0; }
function earthStep() { tick++;
  for (let y = A0; y <= A1; y++) for (let x = A0; x <= A1; x++) { const i = y * G + x, c = P1[i];
    const l = x > A0 ? P1[i - 1] : c, r = x < A1 ? P1[i + 1] : c, u = y > A0 ? P1[i - G] : c, d = y < A1 ? P1[i + G] : c;
    const v = c + (c - P0[i]) * KEEP + C2 * (l + r + u + d - 4 * c); P2[i] = v; const a = v < 0 ? -v : v; env[i] = a > env[i] ? a : env[i] * 0.9985; }
  P2[src] += DRIVE * Math.sin(omega * tick);
  const q = P0; P0 = P1; P1 = P2; P2 = q;
  if (tick % 3 === 0) { let top = 1e-6; for (let y = A0; y <= A1; y += 2) for (let x = A0; x <= A1; x += 2) if (env[y * G + x] > top) top = env[y * G + x];
  for (let k = 0; k < GRAINS; k++) { const e = env[(sy[k] | 0) * G + (sx[k] | 0)] / top - 0.18; if (e <= 0) continue; const amp = e > 0.3 ? 1.5 : e * 5; // sand rests where the plate shakes less than a fifth of its strongest
    let nx = sx[k] + (rnd() - 0.5) * amp, ny = sy[k] + (rnd() - 0.5) * amp; if (nx < A0) nx = A0; if (nx > A1 + 0.99) nx = A1 + 0.99; if (ny < A0) ny = A0; if (ny > A1 + 0.99) ny = A1 + 0.99; sx[k] = nx; sy[k] = ny; } } }
function covered(s) { let n = 0; for (let k = 0; k < GRAINS; k++) { const dx = sx[k] - s[0] - 0.5, dy = sy[k] - s[1] - 0.5; if (dx * dx + dy * dy < 16) n++; } return n; }
function earthVerdict() { if (tick < TOTAL) return 0; return LVE.stones.every(s => covered(s) >= LVE.need) ? 1 : -1; }
const at = (fx, fy) => [Math.round(A0 + fx * (SIDE - 1)), Math.round(A0 + fy * (SIDE - 1))];
const LEVELS = [
  { name: 'Пісок', text: 'Пластина гуде там, де її торкнулися, і пісок тікає звідусіль, де вона тремтить. Він лягає на тихі лінії. Від місця дотику залежить, яка вийде фігура. Засипте піском усі чотири камінці: у пунктирному колі довкола кожного має зібратися досить піску.',
    mode: [2, 0], stones: [at(.125, .125), at(.875, .125), at(.125, .875), at(.875, .875)], need: 48, best: at(.5, .02) },
  { name: 'Інша фігура', text: 'Нота вища, і в пластини тепер більше тихих ліній. Ті самі чотири дотики, що допомогли раніше, тут дадуть не ту фігуру.',
    mode: [1, 3], stones: [[71, 20], [47, 71], [20, 74], [50, 38]], need: 62, best: at(.02, .02) }];
Proto({
  G, levels: LEVELS, build: earthBuild, speed: 16, idleText: 'Торкніться пластини: там вона загуде.',
  tap(x, y) { if (x < A0 || x > A1 || y < A0 || y > A1) { this.say('Торкніться самої пластини.'); return false; } earthTap(x, y); this.say('Пластина гуде, пісок шукає тихі лінії…'); },
  step: earthStep, verdict: earthVerdict,
  winText: () => 'Пісок ліг на всі камінці.',
  failText: () => 'Пісок зібрався в іншу фігуру: засипано ' + LVE.stones.filter(s => covered(s) >= LVE.need).length + ' з ' + LVE.stones.length + ' камінців.',
  draw(g, K, now, size) {
    g.fillStyle = '#0b1418'; g.fillRect(0, 0, size, size);
    const x0 = A0 * K, w = SIDE * K, pl = g.createLinearGradient(x0, x0, x0 + w, x0 + w); pl.addColorStop(0, '#2b3238'); pl.addColorStop(0.5, '#3a434b'); pl.addColorStop(1, '#262c32');
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(x0 + 1.2 * K, x0 + 1.6 * K, w, w); g.fillStyle = pl; g.fillRect(x0, x0, w, w);
    { const r = rng(21); g.lineWidth = 1; for (let k = 0; k < 260; k++) { const y = x0 + r() * w, a = x0 + r() * w * 0.7, len = (0.1 + r() * 0.3) * w; g.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.05)'; g.beginPath(); g.moveTo(a, y); g.lineTo(Math.min(x0 + w, a + len), y); g.stroke(); } }
    g.strokeStyle = '#6b7783'; g.lineWidth = Math.max(1, K * 0.35); g.strokeRect(x0, x0, w, w);
    for (const c of [[A0 + 2, A0 + 2], [A1 - 1, A0 + 2], [A0 + 2, A1 - 1], [A1 - 1, A1 - 1]]) { g.fillStyle = '#1c2227'; g.beginPath(); g.arc(c[0] * K, c[1] * K, 0.7 * K, 0, 7); g.fill(); }
    if (src >= 0 && this.state === 'run') { g.fillStyle = 'rgba(160,200,230,.07)'; for (let y = A0; y <= A1; y += 2) for (let x = A0; x <= A1; x += 2) { const p = P1[y * G + x]; if (p > 0.25) g.fillRect(x * K, y * K, 2 * K, 2 * K); } }
    for (const s of LVE.stones) { const ok = this.state !== 'idle' && this.state !== 'card' && covered(s) >= LVE.need; if (ok) { const gx = (s[0] + .5) * K, gy = (s[1] + .5) * K, gl = g.createRadialGradient(gx, gy, 0, gx, gy, 6 * K); gl.addColorStop(0, 'rgba(143,224,184,.5)'); gl.addColorStop(1, 'rgba(143,224,184,0)'); g.fillStyle = gl; g.fillRect(gx - 6 * K, gy - 6 * K, 12 * K, 12 * K); }
      g.strokeStyle = ok ? 'rgba(143,224,184,.8)' : 'rgba(200,210,220,.28)'; g.lineWidth = Math.max(1, K * 0.18); g.setLineDash([K * 0.9, K * 0.7]); g.beginPath(); g.arc((s[0] + .5) * K, (s[1] + .5) * K, 4 * K, 0, 7); g.stroke(); g.setLineDash([]);
      g.fillStyle = ok ? '#8fe0b8' : '#7c8894'; g.beginPath(); g.arc((s[0] + .5) * K, (s[1] + .5) * K, 1.7 * K, 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = Math.max(1, K * 0.2); g.stroke(); }
    const q = Math.max(1.2, K * 0.42); g.fillStyle = 'rgba(0,0,0,.35)'; for (let k = 0; k < GRAINS; k++) g.fillRect(sx[k] * K - q / 2 + q * 0.5, sy[k] * K - q / 2 + q * 0.6, q, q);
    for (let pass = 0; pass < 3; pass++) { g.fillStyle = ['#e6cf9a', '#f3e2b4', '#c9ae74'][pass]; for (let k = pass; k < GRAINS; k += 3) g.fillRect(sx[k] * K - q / 2, sy[k] * K - q / 2, q, q); }
    if (src >= 0) { const x = (src % G + .5) * K, y = (((src / G) | 0) + .5) * K; g.strokeStyle = '#fff'; g.lineWidth = Math.max(1.5, K * .3); g.beginPath(); g.arc(x, y, 1.3 * K, 0, 7); g.stroke();
      if (this.state === 'run') { const ph = (now / 500) % 1; g.strokeStyle = 'rgba(255,255,255,' + (0.6 * (1 - ph)) + ')'; g.beginPath(); g.arc(x, y, (1.5 + 4 * ph) * K, 0, 7); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(0, size - 4, size, 4); g.fillStyle = '#8fe0b8'; g.fillRect(0, size - 4, size * tick / TOTAL, 4); } }
    if (this.hover && this.state === 'idle') { g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = Math.max(1, K * 0.2); g.beginPath(); g.arc((this.hover[0] + .5) * K, (this.hover[1] + .5) * K, 1.6 * K, 0, 7); g.stroke(); }
  }
});
</script></body></html>
