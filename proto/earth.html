<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Земля: прототип</title><link rel="stylesheet" href="kit.css"></head><body>
<script src="kit.js"></script>
<script>
// LAW: loose ground lies still on a slope steeper than the one it can flow on. Standing soil holds up to the
// static angle; once it moves it keeps moving until the slope is down to the lower, dynamic angle. So a slab that
// is touched goes all at once, the scarp it leaves eats its way uphill until rock or roots stop it, and whatever
// it lands on starts moving too. Among trees the ground holds to a steeper angle whether it is standing or
// arriving, so a forest swallows a small slide; buried deeper than a trunk can bear, the trees snap and go with
// the rest. Water lowers both angles, so wet ground runs far.
const G = 96, STAT = 1.0, DYN = 0.55, RATE = 0.22, ROOT = 1.5, SNAP = 3, WSTAT = 0.8, WDYN = 0.28;
const rock = new Float32Array(G), soil = new Float32Array(G), soil0 = new Float32Array(G), dq = new Float32Array(G), act = new Uint8Array(G), wet = new Uint8Array(G), tree = new Uint8Array(G), moved = new Float32Array(G);
let stepN = 0, moving = 0, LVS = null, buried = -1;
const lerp = (pts, x) => { for (let k = 1; k < pts.length; k++) if (x <= pts[k][0]) { const a = pts[k - 1], b = pts[k]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0] || 1); } return pts[pts.length - 1][1]; };
function slideBuild(L) { LVS = L; stepN = 0; moving = 0; buried = -1; act.fill(0); wet.fill(0); tree.fill(0); soil.fill(0); moved.fill(0);
  for (let x = 0; x < G; x++) rock[x] = lerp(L.rock, x);
  for (const s of L.slabs) for (let x = s[0]; x <= s[1]; x++) { soil[x] = s[2]; if (s[3]) wet[x] = 1; }
  for (const t of L.trees || []) for (let x = t[0]; x <= t[1]; x++) tree[x] = 1;
  soil0.set(soil); }
const H = x => rock[x] + soil[x];
const statOf = x => wet[x] ? WSTAT : STAT, dynOf = x => wet[x] ? WDYN : DYN;
function canSlide(x) { if (soil[x] < 0.5) return false; for (const n of [x - 1, x + 1]) if (n >= 0 && n < G && H(x) - H(n) > dynOf(x)) return true; return false; }
function slideTap(x) { for (let d = -2; d <= 2; d++) { const X = x + d; if (X >= 0 && X < G && soil[X] > 0.2) { act[X] = 40; tree[X] = 0; } } }

  for (let x = 0; x < G; x++) { if (soil[x] <= 0.001) continue; let left = soil[x];
    for (const n of [x + 1, x - 1]) { if (n < 0 || n >= G) continue; const d = H(x) - H(n); if (tree[x] && d > ROOT + 0.04 && soil[n] < soil0[n] - 0.3) { tree[x] = 0; act[x] = 14; } /* the ground below it slipped away: the tree is undercut and goes */
      const lim = tree[x] ? ROOT + 0.04 : act[x] ? dynOf(x) + 0.04 : statOf(x); if (d <= lim) continue; // a little friction to stop: moving ground comes to rest just above its angle

  for (let x = 0; x < G; x++) { if (dq[x]) { soil[x] = Math.max(0, soil[x] + dq[x]); moved[x] += Math.abs(dq[x]); }
    if (tree[x] && soil[x] - soil0[x] > SNAP) { tree[x] = 0; act[x] = 14; } /* buried deeper than a trunk can bear */ if (act[x]) { act[x]--; moving++; } }
  for (const h of LVS.houses || []) { let m = 0; for (let d = -2; d <= 2; d++) m += soil[h + d] - soil0[h + d]; if (m / 5 > 1.0) buried = h; } }
function slideVerdict() { if (buried >= 0) return -1; if (moving || stepN < 3) return 0; const f = LVS.fill; for (let x = f[0]; x <= f[1]; x++) if (H(x) < f[2]) return -1; return 1; }
const LEVELS = [
  {"name": "Пласт", "rock": [[0, 94], [5, 94], [6, 86], [24, 68.9], [25, 75.9], [29, 75.9], [30, 66], [48, 48.9], [49, 55.9], [50, 55.9], [51, 46], [65, 32.7], [66, 38.7], [67, 38.7], [68, 25], [74, 25], [75, 33], [95, 33]], "slabs": [[6, 24, 7], [30, 48, 7], [51, 65, 6]], "fill": [68, 74, 29], "houses": [27], "text": "Земля на схилі лежить пластами, і кожен спирається на кам’яний поріг. Зрушений пласт осідає до пологішого кута; зайве перелітає через поріг і тягне за собою все, на що впаде. Засипте яр до мітки й не засипте хату.", "bx": 39},
  {"name": "Ліс тримає схил", "rock": [[0, 96], [5, 96], [6, 90], [20, 76.7], [21, 83.7], [22, 83.7], [23, 74], [45, 53.1], [46, 57.7], [47, 57.7], [48, 48], [62, 34.7], [63, 40.7], [64, 40.7], [65, 25], [70, 25], [71, 33], [95, 33]], "slabs": [[6, 20, 7], [23, 45, 6], [48, 62, 6]], "trees": [[23, 45]], "fill": [65, 70, 29], "houses": [84], "text": "Коріння тримає схил: ліс ковтає осув, що прийшов згори. Та якщо земля піде з-під нижніх дерев, ліс підрізано, і він падає ряд за рядом. Засипте яр до мітки.", "bx": 43},
  {"name": "Мокрий схил", "rock": [[0, 30], [7, 30], [8, 25], [14, 25], [15, 30], [30, 30], [31, 39], [32, 39], [33, 32], [53, 51], [54, 63.3], [55, 63.3], [56, 58], [66, 65], [67, 80], [70, 80], [71, 70], [85, 56.7], [86, 62.7], [87, 62.7], [88, 45], [95, 45]], "slabs": [[33, 53, 7], [56, 66, 6, 1], [71, 85, 6]], "fill": [8, 14, 28.5], "houses": [92], "text": "Мокра земля, темна й блискуча, тече набагато далі за суху й мочить усе, на що лягає. Яма далеко від підніжжя: сухий осув до неї не дотягне. Засипте яму до мітки й не чіпайте схил над хатою.", "bx": 61}];

const tree0 = new Uint8Array(G); let back = null, backKey = '', dust = [], lastNow = 0;
function paintBack(size, K) { const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), r = rng(3 + LEVELS.indexOf(LVS) * 17);
  const sky = g.createLinearGradient(0, 0, 0, size); sky.addColorStop(0, '#16233f'); sky.addColorStop(0.45, '#4a5f8c'); sky.addColorStop(0.72, '#d99f7a'); sky.addColorStop(1, '#f0c890'); g.fillStyle = sky; g.fillRect(0, 0, size, size);
  const sun = g.createRadialGradient(size * 0.78, size * 0.62, 0, size * 0.78, size * 0.62, size * 0.4); sun.addColorStop(0, 'rgba(255,236,190,.9)'); sun.addColorStop(0.12, 'rgba(255,210,150,.45)'); sun.addColorStop(1, 'rgba(255,200,140,0)'); g.fillStyle = sun; g.fillRect(0, 0, size, size);
  for (let k = 0; k < 40; k++) { g.fillStyle = 'rgba(255,255,255,' + (0.15 + r() * 0.4) + ')'; g.beginPath(); g.arc(r() * size, r() * size * 0.35, (0.08 + r() * 0.14) * K, 0, 7); g.fill(); }
  for (let k = 0; k < 6; k++) { const cx = r() * size, cy = (10 + r() * 30) * K; g.fillStyle = 'rgba(255,225,200,.13)'; for (let q = 0; q < 5; q++) { g.beginPath(); g.ellipse(cx + (q - 2) * 4 * K, cy + (r() - 0.5) * K, (5 + r() * 4) * K, (1.2 + r()) * K, 0, 0, 7); g.fill(); } }
  for (const [base, amp, col] of [[58, 16, '#566a8e'], [68, 12, '#4a5672'], [78, 8, '#3d4458']]) { g.fillStyle = col; g.beginPath(); g.moveTo(0, size); const p1 = r() * 6, p2 = r() * 6; for (let x = 0; x <= G; x += 2) g.lineTo(x * K, (base - amp * (0.5 + 0.5 * Math.sin(x * 0.07 + p1)) - amp * 0.3 * Math.sin(x * 0.23 + p2) - (x % 4 ? 0 : 0.6)) * K); g.lineTo(size, size); g.fill(); }
  g.fillStyle = 'rgba(240,200,150,.12)'; g.fillRect(0, size * 0.55, size, size * 0.45); return c; }
const X = (x, K) => (x + 0.5) * K, Y = (h, K) => (G - h) * K;
Proto({
  G, levels: LEVELS, speed: 10, idleText: 'Торкніться схилу: там земля зрушить.',
  build(L) { slideBuild(L); tree0.set(tree); L.best = [L.bx, Math.round(G - H(L.bx)) - 2]; dust = []; backKey = ''; },
  tap(x) { if (!canSlide(x)) { this.say('Тут нема чому зрушити: голий камінь або рівне місце.'); return false; } slideTap(x); this.say('Пішло…'); },
  step: slideStep, verdict: slideVerdict,
  winText: () => 'Засипано до мітки' + ((LVS.houses || []).length ? ', хата ціла.' : '.'),
  failText: () => buried >= 0 ? 'Осув засипав хату.' : 'Землі зрушило замало: до мітки не досипало.',
  draw(g, K, now, size) {
    const key = size + ':' + LEVELS.indexOf(LVS); if (key !== backKey) { back = paintBack(size, K); backKey = key; } g.drawImage(back, 0, 0); const dt = Math.min(0.25, (now - lastNow) / 1000); lastNow = now;
    for (const h of LVS.houses || []) Art.house(g, X(h, K), Y(rock[h], K) + K * 0.2, K * 0.82, { lit: buried !== h, now });
    // rock: strata that dip to the right, lighter where the sun catches the top
    const trace = f => { g.beginPath(); g.moveTo(0, size); g.lineTo(0, Y(f(0), K)); for (let x = 0; x < G; x++) g.lineTo(X(x, K), Y(f(x), K)); g.lineTo(size, Y(f(G - 1), K)); g.lineTo(size, size); g.closePath(); };
    trace(x => rock[x]); const rg = g.createLinearGradient(0, 0, 0, size); rg.addColorStop(0, '#8d877c'); rg.addColorStop(0.6, '#5f5a53'); rg.addColorStop(1, '#3a3733'); g.fillStyle = rg; g.fill();
    g.save(); g.clip(); g.lineWidth = Math.max(1, K * 0.22); for (let k = -20; k < 60; k++) { g.strokeStyle = k % 3 ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.07)'; g.beginPath(); g.moveTo(0, k * 2.6 * K); g.lineTo(size, (k * 2.6 + 26) * K); g.stroke(); }
    const rr = rng(77); g.strokeStyle = 'rgba(20,18,16,.35)'; g.lineWidth = Math.max(1, K * 0.16); for (let k = 0; k < 40; k++) { const x = rr() * size, y = rr() * size; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rr() - 0.3) * 3 * K, y + (1.5 + rr() * 3) * K); g.lineTo(x + (rr() - 0.5) * 4 * K, y + (4 + rr() * 3) * K); g.stroke(); } g.restore();
    g.strokeStyle = 'rgba(235,225,205,.35)'; g.lineWidth = Math.max(1, K * 0.25); g.beginPath(); for (let x = 0; x < G; x++) x ? g.lineTo(X(x, K), Y(rock[x], K)) : g.moveTo(X(x, K), Y(rock[x], K)); g.stroke();
    // soil: brown earth lying on the rock; wet earth is darker and shines
    for (let a = 0; a < G; a++) { if (soil[a] < 0.05) continue; let b = a; while (b + 1 < G && soil[b + 1] >= 0.05) b++;
      g.beginPath(); g.moveTo(X(a, K) - K * 0.5, Y(rock[a], K)); for (let x = a; x <= b; x++) g.lineTo(X(x, K), Y(H(x), K)); g.lineTo(X(b, K) + K * 0.5, Y(rock[b], K)); for (let x = b; x >= a; x--) g.lineTo(X(x, K), Y(rock[x], K)); g.closePath();
      const sg = g.createLinearGradient(0, Y(H(a), K), 0, Y(rock[b], K) + K); sg.addColorStop(0, '#8a6238'); sg.addColorStop(1, '#4f351f'); g.fillStyle = sg; g.fill(); a = b; }
    for (let x = 0; x < G; x++) { if (soil[x] < 0.3) continue; const px = X(x, K), py = Y(H(x), K), hh = soil[x] * K;
      if (wet[x]) { g.fillStyle = 'rgba(24,40,70,.42)'; g.fillRect(px - K * 0.5, py, K + 0.5, hh); g.fillStyle = 'rgba(190,220,255,.35)'; g.fillRect(px - K * 0.5, py, K + 0.5, K * 0.22); }
      for (let q = 0; q < 2; q++) { const t = Art.h(x * 7 + q); if (t * soil[x] < 0.9) continue; g.fillStyle = q ? 'rgba(40,26,14,.5)' : 'rgba(190,170,140,.55)'; g.beginPath(); g.arc(px + (t - 0.5) * K, py + (0.25 + 0.6 * Art.h(x * 3 + q)) * hh, K * (0.16 + 0.14 * t), 0, 7); g.fill(); }
      if (moved[x] < 0.25 && !wet[x]) { g.strokeStyle = '#4f8a3c'; g.lineWidth = K * 0.55; g.lineCap = 'round'; g.beginPath(); g.moveTo(px - K * 0.5, py + K * 0.1); g.lineTo(px + K * 0.5, py + K * 0.1); g.stroke(); g.strokeStyle = '#7fbf5a'; g.lineWidth = Math.max(1, K * 0.14); g.beginPath(); for (let q = 0; q < 3; q++) { const bx = px + (Art.h(x * 5 + q) - 0.5) * K; g.moveTo(bx, py); g.lineTo(bx + (Art.h(x + q) - 0.5) * K * 0.5, py - K * (0.5 + 0.5 * Art.h(x * 11 + q))); } g.stroke(); } }
    // trees: standing where the roots still hold, lying downhill where the ground went
    for (let x = 1; x < G - 1; x++) { if (!tree0[x] || x % 2) continue; const px = X(x, K), py = Y(H(x), K); if (tree[x]) Art.tree(g, px, py + K * 0.3, K * (7 + 2.5 * Art.h(x)), K * 2.3, x, { pine: true }); else Art.tree(g, px, py, K * 6, K * 1.9, x, { pine: true, lean: (H(x - 1) > H(x + 1) ? 1 : -1) * (1.25 + 0.3 * Art.h(x)) }); }
    // the mark the ground has to reach
    const f = LVS.fill; let done = true; for (let x = f[0]; x <= f[1]; x++) if (H(x) < f[2]) done = false; g.setLineDash([K * 1.2, K * 0.8]); g.strokeStyle = done ? '#8be28b' : '#ffe08a'; g.lineWidth = Math.max(1.5, K * 0.3); g.beginPath(); g.moveTo(X(f[0], K) - K, Y(f[2], K)); g.lineTo(X(f[1], K) + K, Y(f[2], K)); g.stroke(); g.setLineDash([]);
    g.fillStyle = done ? '#8be28b' : '#ffe08a'; g.beginPath(); const fx = X(f[1], K) + K * 1.6, fy = Y(f[2], K); g.moveTo(fx, fy); g.lineTo(fx + K * 1.6, fy - K * 0.9); g.lineTo(fx + K * 1.6, fy + K * 0.9); g.closePath(); g.fill();

    for (const d of dust) { d.a += dt; const l = d.a / (d.c ? 0.6 : 1.5); if (l >= 1) continue; if (d.c) { g.fillStyle = 'rgba(70,46,26,' + (1 - l) + ')'; g.beginPath(); g.arc(d.x * K, Y(d.y + Math.sin(l * Math.PI) * 2.2, K), K * 0.3 * d.s, 0, 7); g.fill(); } else { g.fillStyle = 'rgba(214,190,160,' + 0.22 * (1 - l) + ')'; g.beginPath(); g.arc(d.x * K, Y(d.y + l * 4, K), K * (0.8 + l * 2.4) * d.s, 0, 7); g.fill(); } } dust = dust.filter(d => d.a < 1.5);
    if (this.hover && this.state === 'idle') { const x = this.hover[0], ok = canSlide(x), px = X(x, K), py = Y(H(x), K); g.fillStyle = ok ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.3)'; g.beginPath(); g.moveTo(px, py - K * 0.6); g.lineTo(px - K * 1.1, py - K * 2.6); g.lineTo(px + K * 1.1, py - K * 2.6); g.closePath(); g.fill(); }
  }
});
