<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лід: прототип</title><link rel="stylesheet" href="kit.css"></head><body>
<script src="kit.js"></script>
<script>
// LAW: a crystal grows where cold water gives up its cold. Cells next to ice collect cold from the water
// around them and freeze when they have collected enough; the rest of the water only passes cold along.
// A tip that sticks out reaches fresh cold water first, so it outruns the flat sides: six arms on a hex grid.
const W = 83, HH = 96, N = W * HH, ALPHA = 1;
const WATER = 0, ROCK = 1, SPRING = 2;
const kind = new Uint8Array(N), ice = new Uint8Array(N), born = new Uint16Array(N), nb = new Int32Array(N * 6);
let s = new Float32Array(N), u = new Float32Array(N), u2 = new Float32Array(N), stepN = 0, iceN = 0, LVI = null, fresh = [];
for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++) { const i = y * W + x, o = y & 1, c = [[x - 1, y], [x + 1, y], [x - 1 + o, y - 1], [x + o, y - 1], [x - 1 + o, y + 1], [x + o, y + 1]];
  for (let k = 0; k < 6; k++) { const [X, Y] = c[k]; nb[i * 6 + k] = X < 0 || Y < 0 || X >= W || Y >= HH ? -1 : Y * W + X; } }
function iceBuild(L) { LVI = L; kind.fill(WATER); ice.fill(0); born.fill(0); stepN = 0; iceN = 0; fresh = [];
  for (const c of L.rocks || []) blob(c, ROCK); for (const c of L.springs || []) blob(c, SPRING);
  for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++) { const i = y * W + x; let b = L.cold;
    for (const z of L.zones || []) { const d = Math.hypot((x - z[0]) / z[2], (y - z[1]) / z[3]); if (d < 1) b += (z[4] - L.cold) * Math.min(1, (1 - d) * 3); }
    s[i] = kind[i] === WATER ? b : 0; } }
function blob(c, k) { for (let y = 0; y < HH; y++) for (let x = 0; x < W; x++) { const dx = (x + (y & 1) * 0.5 - c[0]) * 1.1547, dy = y - c[1]; if (dx * dx + dy * dy <= c[2] * c[2]) kind[y * W + x] = k; } }
function freeze(i) { if (kind[i] !== WATER || ice[i]) return; ice[i] = 1; born[i] = stepN; iceN++; fresh.push(i); }
function iceSeed(x, y) { const i = y * W + x; freeze(i); s[i] = 1; }
function iceStep() { stepN++;
  for (let i = 0; i < N; i++) { let r = ice[i]; if (!r) for (let k = 0; k < 6; k++) { const j = nb[i * 6 + k]; if (j >= 0 && ice[j]) { r = 1; break; } } u[i] = r || kind[i] !== WATER ? 0 : s[i]; if (r) u2[i] = -1; else u2[i] = 0; }
  for (let i = 0; i < N; i++) { if (kind[i] !== WATER) { continue; } const rec = u2[i] < 0, c = u[i]; let sum = 0;
    for (let k = 0; k < 6; k++) { const j = nb[i * 6 + k]; sum += j < 0 || kind[j] === ROCK ? c : kind[j] === SPRING ? 0 : u[j]; }

function near(p, r) { for (let y = Math.max(0, p[1] - r); y <= Math.min(HH - 1, p[1] + r); y++) for (let x = Math.max(0, p[0] - r); x <= Math.min(W - 1, p[0] + r); x++) { const dx = (x + (y & 1) * 0.5 - p[0]) * 1.1547, dy = y - p[1]; if (dx * dx + dy * dy <= r * r && ice[y * W + x]) return true; } return false; }
function iceVerdict() { for (const d of LVI.ducks || []) if (near(d, 3)) return -1; if (LVI.posts.every(p => near(p, 3))) return 1; return stepN >= LVI.dawn ? -1 : 0; }
const LEVELS = [{"name":"Кристал","text":"Крижаний кристал росте шістьма променями, а від них відходять бічні гілки. Промінь росте, поки не настане світанок. Торкніться води так, щоб лід дійшов до обох ліхтарів.","cold":0.4,"posts":[[22,48],[60,48]],"dawn":1000,"best":[46,48]},
  {"name":"Качки","text":"Качкам потрібна відкрита вода. Жоден промінь не має пройти крізь їхнє плесо. Наведіть курсор: шість рисок показують, куди піде кристал.","cold":0.4,"posts":[[18,56],[62,56]],"ducks":[[52,32],[25,80]],"dawn":760,"best":[46,58]},
  {"name":"Тепла течія","text":"Вода не всюди однакова. У світлій, холодній воді промінь росте вдвічі швидше; у темній, теплій ледве повзе. Ніч коротка: ведіть промені холодною водою.","cold":0.4,"posts":[[12,30],[70,66]],"zones":[[30,50,9,22,0.2],[60,30,26,8,0.56]],"ducks":[[34,84]],"dawn":900,"best":[60,30]},
  {"name":"Скелі й джерело","text":"Скеля зупиняє промінь. Тепле джерело забирає холод довкола себе, і промінь біля нього хиріє. Три ліхтарі, одна качка, коротка ніч.","cold":0.42,"posts":[[64,50],[27,24],[26,78]],"rocks":[[52,36,5],[14,52,5],[56,70,6]],"springs":[[46,22,4]],"ducks":[[62,24]],"dawn":720,"best":[46,50]}];
// ---- drawing: water tinted by its cold is painted once per level; ice is added to its own layer cell by cell
const G = 96, SX = 1.1547, cold0 = new Float32Array(N);
const low = document.createElement('canvas'); low.width = W; low.height = HH; const lg = low.getContext('2d'), limg = lg.createImageData(W, HH);
const mask = document.createElement('canvas'); mask.width = W; mask.height = HH; const mg = mask.getContext('2d'), mimg = mg.createImageData(W, HH);
let ground = null, iceC = null, icg = null, key = '', drawn = 0, sparks = [], steam = [], lastNow = 0, lostBy = '', winT = 0;
const hash = i => { let h = (i * 2654435761) >>> 0; h ^= h >>> 15; h = (h * 2246822519) >>> 0; h ^= h >>> 13; return (h >>> 0) / 4294967296; };
const px = (i, K) => { const x = i % W, y = (i - x) / W; return [(x + (y & 1) * 0.5 + 0.5) * SX * K, (y + 0.5) * K]; };
const at = (p, K) => [(p[0] + 0.5) * SX * K, (p[1] + 0.5) * K];
function hex(g, cx, cy, r) { g.moveTo(cx, cy - r); for (let k = 1; k < 6; k++) g.lineTo(cx + r * Math.sin(k * Math.PI / 3), cy - r * Math.cos(k * Math.PI / 3)); g.closePath(); }
function paintGround(size, K) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), d = limg.data, r = rng(7 + LEVELS.indexOf(LVI) * 31);

  for (let i = 0; i < N; i++) { const v = Math.max(0, Math.min(1, (cold0[i] - 0.18) / 0.4)), n = hash(i) * 8 - 4; const hi = Math.max(0, (v - 0.6) / 0.4); d[i * 4] = 8 + 44 * v * v + 70 * hi + n; d[i * 4 + 1] = 40 + 52 * v + 62 * hi + n; d[i * 4 + 2] = 50 + 96 * v + 52 * hi + n; d[i * 4 + 3] = 255; }
  lg.putImageData(limg, 0, 0); g.imageSmoothingEnabled = true; g.filter = 'blur(' + (K * 1.6).toFixed(1) + 'px)'; g.drawImage(low, -K, -K, size + 2 * K, size + 2 * K); g.filter = 'none';
  // slow swell lines and the stars the night water reflects
  g.lineWidth = Math.max(1, K * 0.16); for (let k = 0; k < 260; k++) { const x = r() * size, y = r() * size, w = (4 + r() * 10) * K; g.strokeStyle = 'rgba(190,225,255,' + (0.03 + r() * 0.05) + ')'; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w / 2, y - K * (0.4 + r()), x + w, y); g.stroke(); }
  for (let k = 0; k < 150; k++) { g.fillStyle = 'rgba(255,255,255,' + (0.1 + r() * 0.35) + ')'; g.beginPath(); g.arc(r() * size, r() * size, (0.1 + r() * 0.22) * K, 0, 7); g.fill(); }
  const vg = g.createRadialGradient(size / 2, size / 2, size * 0.3, size / 2, size / 2, size * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,6,14,.55)'); g.fillStyle = vg; g.fillRect(0, 0, size, size);
  // warm springs: black water with a soft green rim
  for (const s of LVI.springs || []) { const [x, y] = at(s, K), rad = s[2] * K; const gr = g.createRadialGradient(x, y, rad * 0.2, x, y, rad * 1.7); gr.addColorStop(0, 'rgba(2,18,16,.95)'); gr.addColorStop(0.6, 'rgba(10,60,48,.6)'); gr.addColorStop(1, 'rgba(10,60,48,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad * 1.7, 0, 7); g.fill(); }
  // rocks: one dark boulder each, lit from the upper left, with a cap of snow and a shadow on the water
  for (const s of LVI.rocks || []) { const [x, y] = at(s, K), rad = (s[2] + 0.6) * K, rr = rng(s[0] * 17 + s[1]), pts = []; for (let k = 0; k < 14; k++) pts.push(0.86 + rr() * 0.22);
    const shape = (cx, cy, q) => { g.beginPath(); for (let k = 0; k <= 14; k++) { const a = k / 14 * Math.PI * 2, r1 = rad * q * pts[k % 14]; k ? g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.94) : g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.94); } g.closePath(); };
    g.fillStyle = 'rgba(0,6,14,.45)'; shape(x + rad * 0.14, y + rad * 0.2, 1.05); g.fill();
    const gr = g.createRadialGradient(x - rad * 0.4, y - rad * 0.45, rad * 0.1, x, y, rad * 1.1); gr.addColorStop(0, '#8b93a1'); gr.addColorStop(0.55, '#4a5362'); gr.addColorStop(1, '#232a36'); g.fillStyle = gr; shape(x, y, 1); g.fill();
    g.save(); shape(x, y, 1); g.clip(); g.strokeStyle = 'rgba(12,16,24,.5)'; g.lineWidth = Math.max(1, K * 0.18); for (let k = 0; k < 5; k++) { const a = rr() * 6.3; g.beginPath(); g.moveTo(x + Math.cos(a) * rad * 0.15, y + Math.sin(a) * rad * 0.15); g.lineTo(x + Math.cos(a + 0.3) * rad * 0.7, y + Math.sin(a + 0.3) * rad * 0.7); g.lineTo(x + Math.cos(a + 0.1) * rad * 1.1, y + Math.sin(a + 0.1) * rad * 1.1); g.stroke(); }
    const sn = g.createRadialGradient(x - rad * 0.3, y - rad * 0.4, 0, x - rad * 0.3, y - rad * 0.4, rad * 0.85); sn.addColorStop(0, 'rgba(250,253,255,.97)'); sn.addColorStop(0.7, 'rgba(226,238,250,.9)'); sn.addColorStop(1, 'rgba(226,238,250,0)'); g.fillStyle = sn; g.fillRect(x - rad * 1.3, y - rad * 1.3, rad * 2.6, rad * 2.6); g.restore(); }
  return c;
}
function addIce(K) { // new cells go onto the ice layer once; older cells are never redrawn
  for (; drawn < fresh.length; drawn++) { const i = fresh[drawn], [x, y] = px(i, K), t = hash(i), v = 205 + 50 * t | 0;
    icg.fillStyle = 'rgba(' + (v - 26) + ',' + (v - 6) + ',255,.94)'; icg.beginPath(); hex(icg, x, y, K * 0.64); icg.fill();
    icg.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.5 * t) + ')'; icg.beginPath(); icg.moveTo(x, y - K * 0.62); icg.lineTo(x + K * 0.54, y - K * 0.3); icg.lineTo(x, y); icg.closePath(); icg.fill();
    icg.fillStyle = 'rgba(60,110,170,.28)'; icg.beginPath(); icg.moveTo(x, y + K * 0.62); icg.lineTo(x - K * 0.54, y + K * 0.3); icg.lineTo(x, y); icg.closePath(); icg.fill();
    if (sparks.length < 260) sparks.push({ i, a: 0 }); }
}
function star(g, x, y, r, a) { g.fillStyle = 'rgba(255,255,255,' + a + ')'; g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill(); }
Proto({
  G, levels: LEVELS, speed: 3, idleText: 'Торкніться води: там народиться кристал.',
  build(L) { iceBuild(L); cold0.set(s); key = ''; sparks = []; steam = []; lostBy = ''; },
  tap(x, y) { const c = Math.max(0, Math.min(W - 1, Math.round(x / SX - (y & 1) * 0.5))), i = y * W + c;
    if (kind[i] !== WATER) { this.say(kind[i] === ROCK ? 'На камені кристал не виросте. Торкніться води.' : 'У теплому джерелі лід не візьметься. Торкніться холодної води.'); return false; }
    if ((LVI.ducks || []).some(d => Math.hypot((c - d[0]) * SX, y - d[1]) < 7)) { this.say('Надто близько до качки. Торкніться далі.'); return false; }
    iceSeed(c, y); this.say('Росте…'); },
  step: iceStep,
  verdict() { const v = iceVerdict(); if (v < 0) lostBy = (LVI.ducks || []).some(d => near(d, 3)) ? 'duck' : 'dawn'; return v; },
  winText: () => 'Лід дійшов до всіх ліхтарів' + ((LVI.ducks || []).length ? ', качки на воді.' : '.'),
  failText: () => lostBy === 'duck' ? 'Лід скував плесо качки.' : 'Світає, а лід дійшов не до всіх ліхтарів: промені пішли не туди або вода була затепла.',
  draw(g, K, now, size) {
    const k2 = size + ':' + LEVELS.indexOf(LVI); if (k2 !== key) { ground = paintGround(size, K); iceC = document.createElement('canvas'); iceC.width = iceC.height = size; icg = iceC.getContext('2d'); drawn = 0; key = k2; }
    if (drawn > fresh.length) { icg.clearRect(0, 0, size, size); drawn = 0; }
    const dt = Math.min(0.25, (now - lastNow) / 1000); lastNow = now; g.drawImage(ground, 0, 0); addIce(K);
    // steam over the warm springs
    for (const sp of LVI.springs || []) if (steam.length < 60 && Math.random() < 0.25) steam.push({ x: sp[0] + (Math.random() - 0.5) * sp[2] * 1.4, y: sp[1] + (Math.random() - 0.5) * sp[2], a: 0 });
    for (const m of steam) { m.a += dt; m.y -= dt * 1.6; const l = m.a / 3; if (l < 1) { const [x, y] = at([m.x, m.y], K); g.fillStyle = 'rgba(210,235,230,' + 0.1 * Math.sin(l * Math.PI) + ')'; g.beginPath(); g.arc(x, y, (1 + l * 2.5) * K, 0, 7); g.fill(); } } steam = steam.filter(m => m.a < 3);
    // the six directions a crystal would take from under the cursor
    if (this.hover && this.state === 'idle') { const hx = (this.hover[0] + 0.5) * K, hy = (this.hover[1] + 0.5) * K; g.lineWidth = Math.max(1, K * 0.22); g.lineCap = 'round';
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3, ex = hx + Math.cos(a) * 16 * K, ey = hy + Math.sin(a) * 16 * K, gr = g.createLinearGradient(hx, hy, ex, ey); gr.addColorStop(0, 'rgba(220,240,255,.75)'); gr.addColorStop(1, 'rgba(220,240,255,0)'); g.strokeStyle = gr; g.beginPath(); g.moveTo(hx, hy); g.lineTo(ex, ey); g.stroke(); } }
    // glow: the ice mask at grid size, blurred and added as light; then the ice itself with a shadow on the water
    if (fresh.length) { const d = mimg.data; for (let i = 0; i < N; i++) { d[i * 4] = 150; d[i * 4 + 1] = 205; d[i * 4 + 2] = 255; d[i * 4 + 3] = ice[i] ? 70 : 0; } mg.putImageData(mimg, 0, 0);
      g.save(); g.globalCompositeOperation = 'lighter'; g.filter = 'blur(' + (K * 3).toFixed(1) + 'px)'; g.drawImage(mask, 0.25 * SX * K, 0, W * SX * K, size); g.restore(); g.filter = 'none';
      g.save(); g.shadowColor = 'rgba(0,10,24,.6)'; g.shadowBlur = K * 1.2; g.shadowOffsetY = K * 0.5; g.drawImage(iceC, 0, 0); g.restore(); }
    // fresh ice flashes as it sets; old ice keeps a slow random glitter
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const sp of sparks) { sp.a += dt; const l = sp.a / 0.7; if (l >= 1) continue; const [x, y] = px(sp.i, K), rad = (1.5 - l) * 1.6 * K, gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(255,255,255,' + 0.9 * (1 - l) + ')'); gr.addColorStop(1, 'rgba(140,200,255,0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
    sparks = sparks.filter(sp => sp.a < 0.7);
    for (let k = 0; k < 26 && fresh.length; k++) { const t = now / 1400 + k * 0.37, ph = t % 1, i = fresh[Math.floor(hash(k * 977 + Math.floor(t) * 131) * fresh.length)], [x, y] = px(i, K); star(g, x, y, (0.6 + 2.2 * Math.sin(ph * Math.PI)) * K, 0.85 * Math.sin(ph * Math.PI)); }
    // on a win a band of light runs through the crystal in the order it froze, from the seed to the tips
    if (this.state === 'win') { winT += dt; const n = fresh.length, head = (winT * 0.55 % 1.5) * n; for (let k = Math.max(0, Math.floor(head - n * 0.07)); k < Math.min(n, head); k++) { const [x, y] = px(fresh[k], K), rad = 1.5 * K, a2 = 0.5 * (1 - (head - k) / (n * 0.07)), gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(255,236,190,' + a2 + ')'); gr.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); } } else winT = 0;

    for (const d of LVI.ducks || []) { const [x, y] = at(d, K); Art.duck(g, x, y, K * 1.3, now, near(d, 3)); }

    const p = Math.min(1, stepN / LVI.dawn), u = size / 600; if (p > 0.5) { const q = (p - 0.5) * 2, sk = g.createLinearGradient(0, 0, size, size); sk.addColorStop(0, 'rgba(255,170,110,' + 0.34 * q * q + ')'); sk.addColorStop(1, 'rgba(255,120,150,0)'); g.fillStyle = sk; g.fillRect(0, 0, size, size); }
    g.fillStyle = 'rgba(4,16,26,.7)'; g.beginPath(); g.roundRect(14 * u, 12 * u, 190 * u, 22 * u, 11 * u); g.fill(); g.fillStyle = 'rgba(255,255,255,.14)'; g.beginPath(); g.roundRect(40 * u, 21 * u, 138 * u, 4 * u, 2 * u); g.fill();
    const bg = g.createLinearGradient(40 * u, 0, 178 * u, 0); bg.addColorStop(0, '#8fb8ff'); bg.addColorStop(1, '#ffb070'); g.fillStyle = bg; g.beginPath(); g.roundRect(40 * u, 21 * u, Math.max(1, 138 * u * p), 4 * u, 2 * u); g.fill();
    Art.moon(g, 27 * u, 23 * u, 6 * u); Art.sun(g, 191 * u, 23 * u, 7 * u);
  }
});
