<script id="fs" type="x-shader/x-fragment">#version 300 es

in vec2 v;out vec4 o;

const float N=120.;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}

float H(vec2 s){return texture(uH,s/N).r;}
float ell(vec2 s){vec2 q=(s-uPond.xy)/uPond.zw;return dot(q,q);}
float depthAt(vec2 s){float d=min(1.,(1.-ell(s))*uBase);for(int i=0;i<4;i++){vec2 q=s-uBar[i].xy;d-=uBar[i].z*exp(-dot(q,q)/uBar[i].w);}return clamp(d,.1,2.);}

for(int n=0;n<4;n++){float tt=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));c+=1./length(vec2(p.x/(sin(i.x+tt)/k),p.y/(cos(i.y+tt)/k)));}

vec2 q=d.xy/(z+.15)*55.;vec2 cell=floor(q);float st=step(.972,hash(cell))*smoothstep(.42,0.,length(fract(q)-.5))*(.6+.4*sin(uT*2.+hash(cell+3.)*20.));c+=vec3(.9,.95,1.)*st*smoothstep(.02,.2,z);
vec2 mw=d.xy/(z+.25);float bd=dot(mw,vec2(.6,.8))-.2,band=exp(-bd*bd*6.);c+=vec3(.16,.17,.24)*band*fbm(mw*3.)*smoothstep(.02,.3,z);

float mk=floor(uT/6.5),mp=fract(uT/6.5)/.13;if(mp<1.){vec2 fa=vec2(60.)-uCP.xy;vec2 ap=vec2(mod(atan(d.y,d.x)-atan(fa.y,fa.x)+3.1416,6.2832)-3.1416,asin(z)); // azimuth from where the camera looks, and elevation

else{float t=-ro.z/rd.z;vec2 s=(ro+rd*t).xy;float sh=shore(s);
if(sh>=0.){t=(H(s)*15.*uTilt-ro.z)/rd.z;s=(ro+rd*t).xy;sh=shore(s);}

col=mix(sand,grass,smoothstep(.3,.75,tt+(fbm(s*.45)-.5)*.6));
if(uReed<.5){float st=smoothstep(-3.6,-.2,sh+(noise(s*.7)-.5)*1.6);vec2 gc=floor(s*.55+vec2(0.,floor(s.x*.55)*.5));vec3 stc=vec3(.6,.58,.54)*(.62+.5*hash(gc))*(.8+.3*fbm(s*2.));col=mix(col,stc,st);}
col*=mix(.66,1.,smoothstep(0.,1.8,-sh));col*=mix(vec3(1.),vec3(1.05,.8,.62),uFin*(1.-uNight));col*=1.-.32*uNight;}
else{float h=H(s),e=.75;float hx=H(s+vec2(e,0))-H(s-vec2(e,0)),hy=H(s+vec2(0,e))-H(s-vec2(0,e));
vec2 a=vec2(noise(s*.8+vec2(uT*.55,0.))-.5,noise(s*.8+vec2(5.,uT*.45))-.5)*.05+(vec2(noise(s*2.6-uT*.9),noise(s*2.6+uT*.8+9.))-.5)*.02;float gust=smoothstep(.55,.85,fbm(s*.06+vec2(uT*.035,uT*.02)));a+=(vec2(noise(s*4.1+uT*2.3),noise(s*4.1-uT*2.1+3.))-.5)*.09*gust; // cat's paws: patches of wind ripple that drift across the pond
float slope=clamp(length(vec2(hx,hy))*55.,0.,1.);vec2 cg=vec2(noise(s*5.3+vec2(uT*2.1,0.))-noise(s*5.3+vec2(uT*2.1+.37,0.)),noise(s*5.3+vec2(0.,uT*1.8))-noise(s*5.3+vec2(.37,uT*1.8)))*slope*.9; // capillary ripples riding on the wave's slopes

float dep=depthAt(s);vec2 sb=s+n.xy*(2.+11.*dep)+rd.xy/max(-rd.z,.15)*dep*3.*uTilt;if(shore(sb)<.3)sb=s;
vec3 bt=vec3(.86,.78,.6)*(.8+.32*fbm(sb*.8));
bt*=.92+.08*sin(sb.x*1.5+sin(sb.y*.45)*2.+fbm(sb*.3)*6.);

vec2 gg=floor(s*1.25);vec2 cc=(gg+.5+(vec2(hash(gg+3.1),hash(gg+7.7))-.5)*.75)/1.25;vec2 q=s-cc-vec2(sin(uT*1.3+gg.x)*.06,0.);

for(int i=0;i<6;i++){vec2 q=s-uB[i].xy;float sc=1.+clamp(H(uB[i].xy)*2.4,-.12,.32);float r=length(q)/sc;if(r<uNeed+1.6){float a=atan(q.y,q.x),w=uB[i].z,lit=uB[i].w;
