<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 v;out vec4 o;
uniform sampler2D uH;uniform float uT,uF,uTilt,uFin,uBase;uniform vec3 uCP,uCT,uUp;
uniform vec4 uPond,uB[4],uBar[4];uniform vec3 uLand[2],uRock[3];uniform float uLt[4];uniform float uReed,uWallW,uNeed;uniform vec3 uWeed[2];uniform vec4 uWall[4];
const float N=120.;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+7.1;a*=.5;}return s;}
float H(vec2 s){return texture(uH,s/N).r;}
float ell(vec2 s){vec2 q=(s-uPond.xy)/uPond.zw;return dot(q,q);}
float depthAt(vec2 s){float d=min(1.,(1.-ell(s))*uBase);for(int i=0;i<4;i++){vec2 q=s-uBar[i].xy;d-=uBar[i].z*exp(-dot(q,q)/uBar[i].w);}return clamp(d,.1,2.);}
float shore(vec2 s){float r=(1.-sqrt(ell(s)))*min(uPond.z,uPond.w);for(int i=0;i<2;i++)r=min(r,length(s-uLand[i].xy)-uLand[i].z);return r;}
float segd(vec2 p,vec4 a){vec2 d=a.zw-a.xy,q=p-a.xy;float t=clamp(dot(q,d)/max(dot(d,d),1e-4),0.,1.);return length(q-d*t);}
float wallD(vec2 s){return min(min(segd(s,uWall[0]),segd(s,uWall[1])),min(segd(s,uWall[2]),segd(s,uWall[3])))-uWallW;}
float caus(vec2 p,float t){const float TAU=6.28318;p=mod(p,TAU)-250.;vec2 i=p;float c=1.,k=.005;
for(int n=0;n<4;n++){float tt=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));c+=1./length(vec2(p.x/(sin(i.x+tt)/k),p.y/(cos(i.y+tt)/k)));}
c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}
vec3 sunCol(){return mix(vec3(1.,.97,.9),vec3(1.,.66,.3),uFin);}
vec3 sky(vec3 d,vec3 L){float z=max(d.z,0.);
vec3 day=mix(vec3(.8,.88,.97),vec3(.3,.55,.92),pow(z,.5)),eve=mix(vec3(1.,.6,.28),vec3(.26,.28,.55),pow(z,.42));
vec3 c=mix(day,eve,uFin);
float cl=smoothstep(.5,.75,fbm(d.xy/(z+.25)*1.3+uT*.01));c=mix(c,mix(vec3(1.),vec3(1.,.72,.55),uFin),cl*.5);
float sd=max(dot(d,L),0.);c+=sunCol()*pow(sd,22.)*.3*(.4+uFin);return c;}
float sph(vec3 ro,vec3 rd,vec3 c,float r){vec3 oc=ro-c;float b=dot(oc,rd),h=b*b-dot(oc,oc)+r*r;if(h<0.)return -1.;return -b-sqrt(h);}
void main(){vec2 p=vec2(v.x*2.-1.,1.-v.y*2.);
vec3 fw=normalize(uCT-uCP),rt=normalize(cross(uUp,fw)),up=cross(fw,rt);
vec3 rd=normalize(fw*uF+rt*p.x+up*p.y),ro=uCP;
vec3 L=normalize(mix(vec3(-.45,-.55,.7),vec3(-.16,-.92,.2),uFin)),SC=sunCol();
vec3 V=normalize(mix(vec3(0.,.33,1.),-rd,uTilt));
vec3 col;float tHit=1e9;
if(rd.z>-1e-4){col=sky(rd,L)+SC*pow(max(dot(rd,L),0.),600.)*6.;}
else{float t=-ro.z/rd.z;vec2 s=(ro+rd*t).xy;float sh=shore(s);
if(sh>=0.){t=(H(s)*15.*uTilt-ro.z)/rd.z;s=(ro+rd*t).xy;sh=shore(s);}
tHit=t;
if(sh<0.){float tt=clamp(-sh/6.,0.,1.);
vec3 sand=vec3(.86,.78,.6)*(.86+.28*fbm(s*1.3));
vec3 grass=mix(vec3(.17,.36,.13),vec3(.38,.56,.2),fbm(s*.3))*(.75+.5*noise(s*4.));
col=mix(sand,grass,smoothstep(.3,.75,tt+(fbm(s*.45)-.5)*.6));
if(uReed<.5){float st=smoothstep(-3.6,-.2,sh+(noise(s*.7)-.5)*1.6);vec2 gc=floor(s*.55+vec2(0.,floor(s.x*.55)*.5));vec3 stc=vec3(.6,.58,.54)*(.62+.5*hash(gc))*(.8+.3*fbm(s*2.));col=mix(col,stc,st);}
col*=mix(.66,1.,smoothstep(0.,1.8,-sh));col*=mix(vec3(1.),vec3(1.05,.8,.62),uFin);}
else{float h=H(s),e=.75;float hx=H(s+vec2(e,0))-H(s-vec2(e,0)),hy=H(s+vec2(0,e))-H(s-vec2(0,e));
vec2 a=vec2(noise(s*.8+vec2(uT*.55,0.))-.5,noise(s*.8+vec2(5.,uT*.45))-.5)*.05+(vec2(noise(s*2.6-uT*.9),noise(s*2.6+uT*.8+9.))-.5)*.02;
vec3 n=normalize(vec3(-hx*19.-a.x*.6,-hy*19.-a.y*.6,1.));
float dep=depthAt(s);vec2 sb=s+n.xy*(2.+11.*dep)+rd.xy/max(-rd.z,.15)*dep*3.*uTilt;if(shore(sb)<.3)sb=s;
vec3 bt=vec3(.86,.78,.6)*(.8+.32*fbm(sb*.8));
bt*=.92+.08*sin(sb.x*1.5+sin(sb.y*.45)*2.+fbm(sb*.3)*6.);
float pb=smoothstep(.7,.76,noise(sb*1.1+30.));bt=mix(bt,vec3(.46,.44,.4)*(.8+.4*noise(sb*4.)),pb*.7);
float lap=H(s+vec2(1,0))+H(s-vec2(1,0))+H(s+vec2(0,1))+H(s-vec2(0,1))-4.*h;
float ca=caus(sb*.36,uT*.65)*(1.15-.75*dep)+max(-lap,0.)*10.;
bt*=(.74+ca)*mix(vec3(1.),vec3(1.1,.85,.6),uFin);
vec3 tr=exp(-dep*dep*vec3(4.4,1.75,1.05));
col=bt*tr+mix(vec3(.01,.16,.28),vec3(.05,.1,.2),uFin)*(1.-tr);col=mix(col,vec3(0.,.02,.07),smoothstep(1.03,1.85,dep)*.82);col*=1.+clamp(h*6.5,-.4,.7);
col+=mix(vec3(.85,.95,1.),vec3(1.,.85,.6),uFin)*smoothstep(.02,.09,h)*.32;
vec2 so=-normalize(L.xy)*(.6+uFin*1.4);
col*=mix(.6,1.,smoothstep(-.3,1.5,wallD(s-so*2.5)));
for(int i=0;i<3;i++){float ds=length(s-uRock[i].xy-so*uRock[i].z);col*=mix(.6,1.,smoothstep(uRock[i].z*.9,uRock[i].z*1.2,ds));}
for(int i=0;i<4;i++){float dg=length(s-uB[i].xy);col+=vec3(1.,.55,.12)*exp(-dg*dg/60.)*uFin*uB[i].w*(.45+.15*sin(uT*5.+float(i)));}
float F=.03+.97*pow(1.-max(dot(n,V),0.),5.);
vec3 R=reflect(-V,n);R.z=abs(R.z);
col=mix(col,sky(R,L),clamp(F*1.3,0.,.92));
float sd=max(dot(R,L),0.);col+=SC*(pow(sd,300.)*3.2+pow(sd,40.)*.25*uFin);
float fo=smoothstep(1.7,0.,sh+(noise(s*1.6+uT*.35)-.5)*1.5+sin(uT*1.4+s.x*.3+s.y*.2)*.3);col=mix(col,vec3(.96,.98,.99)*mix(vec3(1.),vec3(1.,.85,.7),uFin),fo*.6);
vec3 TN=mix(vec3(1.),vec3(1.08,.84,.66),uFin*.7);
for(int i=0;i<2;i++){float dw=length(s-uWeed[i].xy)-uWeed[i].z+1.+(fbm(s*.45+float(i)*7.)-.5)*4.5;
float m=smoothstep(1.2,-1.8,dw)*smoothstep(.3,.52,noise(s*2.7+n.xy*3.)+noise(s*6.9)*.4);
vec3 wc=mix(vec3(.17,.4,.09),vec3(.52,.74,.2),noise(s*5.3+3.))*(.72+.45*max(dot(n,L),0.))*TN;col=mix(col,wc,m*.93);}
if(uReed>.5){float rb=smoothstep(10.5,3.5,sh+(fbm(s*.55)-.5)*4.);col*=1.-rb*.22;
vec2 gg=floor(s*1.25);vec2 cc=(gg+.5+(vec2(hash(gg+3.1),hash(gg+7.7))-.5)*.75)/1.25;vec2 q=s-cc-vec2(sin(uT*1.3+gg.x)*.06,0.);
float dd=length(vec2(q.x+q.y*.35,q.y*.42));float stalk=smoothstep(.36,.14,dd)*step(1.02-rb*.9,hash(gg+.37));
col=mix(col,mix(vec3(.13,.27,.07),vec3(.5,.58,.22),hash(gg+1.7))*(.8+.4*max(dot(n,L),0.))*TN,stalk);}
for(int i=0;i<4;i++){vec2 q=s-uB[i].xy;float sc=1.+clamp(H(uB[i].xy)*2.4,-.12,.32);float r=length(q)/sc;if(r<uNeed+1.6){float a=atan(q.y,q.x),w=uB[i].z,lit=uB[i].w;
float notch=smoothstep(.05,.2,abs(a-(float(i)*1.3-2.))-.02);
float pad=smoothstep(uNeed+.8,uNeed+.55,r)*notch;
vec3 pc=mix(vec3(.11,.38,.15),vec3(.27,.56,.2),.5+.5*cos(a*11.))*(.7+.4*r/(uNeed+.8))*(.65+.55*max(dot(n,L),0.))*TN*(.9+.5*(sc-1.));
col=mix(col,pc,pad*.97);
col=mix(col,vec3(1.,1.,.95),(1.-lit)*.95*smoothstep(.24,.06,abs(length(q)-uNeed))*step(.45,fract(a*3.82)));
float ro2=1.15+(uNeed-1.25)*w,l1=.5+.5*pow(abs(cos(a*4.)),.55),l2=.5+.5*pow(abs(sin(a*4.)),.55);
float p1=smoothstep(ro2*l1,ro2*l1-.28,r);vec3 c1=mix(vec3(1.,.96,.95),vec3(.96,.5,.7),smoothstep(0.,ro2,r))*(.82+.18*smoothstep(ro2*l1,ro2*l1*.6,r));
col=mix(col,c1*TN,p1);
float ri=ro2*.63,p2=smoothstep(ri*l2,ri*l2-.22,r);vec3 c2=mix(vec3(1.),vec3(1.,.7,.82),smoothstep(0.,ri,r))*(.86+.14*smoothstep(ri*l2,ri*l2*.6,r));
col=mix(col,c2*TN,p2);
float cr=.3+.6*min(w,1.);col=mix(col,mix(vec3(.9,.62,.16),vec3(1.,.86,.32),lit),smoothstep(cr,cr-.18,r)*smoothstep(.2,.55,w));
col+=vec3(.42,.26,.06)*lit*(.6+uFin)*smoothstep(uNeed+.3,0.,r)*(.75+.25*sin(uT*5.+float(i)));}}
}
float fd=length(s-60.);col=mix(col,sky(normalize(vec3(rd.xy,.02)),L),smoothstep(110.,700.,fd)*uTilt);}
vec3 Hh=normalize(L+V);
for(int i=0;i<3;i++){if(uRock[i].z<.5)continue;vec3 c=vec3(uRock[i].xy,-uRock[i].z*.3);float ts=sph(ro,rd,c,uRock[i].z*1.05);if(ts>0.&&ts<tHit){tHit=ts;vec3 q=ro+rd*ts;vec2 s=q.xy;
vec3 n=normalize(normalize(q-c)+vec3((noise(s*1.7)-.5)*.5,(noise(s*1.7+4.)-.5)*.5,0.));
vec3 base=vec3(.56,.55,.52)*(.72+.5*fbm(s*.9+float(i)*3.));base=mix(base,vec3(.3,.36,.22),smoothstep(.55,.8,fbm(s*.7+2.))*.5);
col=base*(.3+.9*max(dot(n,L),0.))*mix(vec3(1.),vec3(1.15,.8,.55),uFin)+SC*pow(max(dot(n,Hh),0.),30.)*.12;col*=mix(.55,1.,smoothstep(0.,2.,q.z));}}
if(rd.z<-1e-4){for(int k=0;k<6;k++){float zz=2.5-float(k)*.5,tk=(zz-ro.z)/rd.z;if(tk>tHit)break;vec2 s=(ro+rd*tk).xy;if(wallD(s)<0.&&shore(s)>-3.){
vec2 gc=floor(vec2(s.x*.4+floor(s.y*.7)*.5,s.y*.7));vec3 base=vec3(.6,.58,.54)*(.7+.35*hash(gc))*(.82+.3*fbm(s*1.9));
col=base*(k==0?.72+.4*max(L.z,0.):.5)*mix(vec3(1.),vec3(1.15,.8,.55),uFin);tHit=tk;break;}}}
for(int i=0;i<4;i++){if(uB[i].w>.5){vec2 c=uB[i].xy;float dd=dot(rd.xy,rd.xy)+1e-5,tb=dot(c-ro.xy,rd.xy)/dd,zb=ro.z+rd.z*tb,d=length(ro.xy+rd.xy*tb-c),lt=uLt[i],hg=9.+34.*exp(-lt*1.3);
float g=exp(-d*d/(1.2+2.5*exp(-lt*3.)))*smoothstep(0.,1.5,zb)*exp(-max(zb,0.)/hg)*step(0.,tb)*step(tb,tHit+3.);
col+=vec3(1.,.78,.35)*g*(.55+1.6*exp(-lt*2.))*uTilt;}}
col*=1.-uFin*.35*smoothstep(.5,1.4,length(p));
o=vec4(col,1.);}

<script>
//CORE>
const N=120,STEPS=760,DAMP=0.9982,RB=10;
const blk=new Uint8Array(N*N),dep=new Float32Array(N*N),c2=new Float32Array(N*N),dmp=new Float32Array(N*N),cE=new Float32Array(N*N),cS=new Float32Array(N*N);
let LV=null,BUOYS=[],U=new Float32Array(N*N),P=new Float32Array(N*N),Q=new Float32Array(N*N),MX=[],ARR=[],STEP=0;
function segd(x,y,a){const dx=a[2]-a[0],dy=a[3]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(x-a[0]-dx*t,y-a[1]-dy*t)}
function buildLevel(L){LV=L;BUOYS=L.lilies;blk.fill(0);const[cx,cy,rx,ry]=L.pond;
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;const e=((x-cx)/rx)**2+((y-cy)/ry)**2;let out=e>=1||x<1||y<1||x>N-2||y>N-2;
let sh=(1-Math.sqrt(e))*Math.min(rx,ry);
for(const[lx,ly,lr]of L.lands||[]){const dl=Math.hypot(x-lx,y-ly)-lr;if(dl<0)out=true;sh=Math.min(sh,dl)}
if(out){blk[i]=1;dep[i]=0;c2[i]=0;dmp[i]=0;continue}
for(const[rx2,ry2,rr]of L.rocks||[])if((x-rx2)**2+(y-ry2)**2<rr*rr)blk[i]=1;
for(const w of L.walls||[])if(segd(x,y,w)<w[4])blk[i]=1;
let d=Math.min(1,(1-e)*L.base);for(const[bx,by,ba,bw]of L.bars||[])d-=ba*Math.exp(-((x-bx)**2+(y-by)**2)/bw);
d=Math.max(0.1,Math.min(2,d));dep[i]=d;c2[i]=0.25*(0.22+0.78*d);
let a=0;if(L.reeds&&sh<RB)a=0.5*((RB-sh)/RB)**2;
for(const[wx,wy,wr]of L.weeds||[]){const dd=Math.hypot(x-wx,y-wy);if(dd<wr)a=Math.max(a,0.05*Math.min(1,(wr-dd)/3))}
dmp[i]=1-a}
for(let i=0;i<N*N-N;i++){cE[i]=blk[i]||blk[i+1]?0:0.5*(c2[i]+c2[i+1]);cS[i]=blk[i]||blk[i+N]?0:0.5*(c2[i]+c2[i+N])}
simReset()}
function simReset(){U.fill(0);P.fill(0);Q.fill(0);MX=BUOYS.map(()=>0);ARR=BUOYS.map(()=>0);STEP=0}
function simDrop(dx,dy){for(let y=-7;y<=7;y++)for(let x=-7;x<=7;x++){const X=dx+x,Y=dy+y;if(X<1||Y<1||X>=N-1||Y>=N-1||blk[Y*N+X])continue;const v=-Math.exp(-(x*x+y*y)/7);U[Y*N+X]=v;P[Y*N+X]=v}}
function simTick(){for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x;if(blk[i])continue;const c=U[i];
Q[i]=(c+(c-P[i])*dmp[i]+cE[i]*(U[i+1]-c)+cE[i-1]*(U[i-1]-c)+cS[i]*(U[i+N]-c)+cS[i-N]*(U[i-N]-c))*DAMP}
const q=P;P=U;U=Q;Q=q;STEP++;
